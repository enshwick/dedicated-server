# The merge gate: `cargo xtask check` on the organization runners through the
# shared workflow, on every pull request, and the full suite nightly. A
# pull request that changes no file that builds finishes in seconds; a path
# filter here would keep the required check from ever reporting.
name: ci

on:
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/rust-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      windows-tests: false
    permissions:
      contents: read
