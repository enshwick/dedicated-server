[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks: the checks a change needs and the Linux image, run as cargo xtask"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
