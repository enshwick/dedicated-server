apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "dedicated-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dedicated-server.labels" . | nindent 4 }}
  ports:
    - name: query
      protocol: UDP
      port: {{ .Values.service.port }}
      targetPort: query
