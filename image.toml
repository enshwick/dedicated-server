# What `cargo xtask image` builds the Linux image from. Each source is pinned
# by digest or checksum; Renovate moves the pins.

# SteamCMD on Debian, with the 32-bit libraries SteamCMD needs. amd64 only:
# the game is an x86-64 Windows program.
base = "docker.io/steamcmd/steamcmd:debian-trixie@sha256:5e11e4eb202528a48d8f03809dc709eb1168359f89720c28740879a9e0cfa894"

# The Proton build whose Wine runs the server.
[proton]
version = "GE-Proton11-11"
url = "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/GE-Proton11-11/GE-Proton11-11-x86_64.tar.gz"
sha512 = "30160946a5e4ffdf1f29d6f83a3d27108f6aa71b6aa59095b2c2260fe3a003b62acf8fdcb02a3dfc602b28473f5679d8a3eaee5a8adb141c1dfa01c42888da2d"
# Left out, relative to the archive's top folder: the .NET and HTML engines,
# the fonts, the speech and text data, and the prefix template, none of
# which a server without a window loads. The launcher turns the .NET and
# HTML engines off.
exclude = [
    "files/share/default_pfx",
    "files/share/espeak-ng-data",
    "files/share/fonts",
    "files/share/libtashkeel_model.ort",
    "files/share/wine/gecko",
    "files/share/wine/mono",
    "protonfixes",
]

# The loader and the mods, as the platform publishes them for a game folder.
# Its build provenance is checked before it goes into the image: built in
# the repository by the organization's workflow.
[loader]
repository = "enshwick/enshwick"
release = "dev"
asset = "enshwick.zip"
signer-workflow = "enshwick/.github/.github/workflows/dev-bundle.yml"
