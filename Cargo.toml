[package]
name = "enshwick-server"
version = "0.0.0-dev"
description = "Runs and installs an Enshrouded dedicated server with the Enshwick loader"
keywords = ["enshrouded", "server"]
categories = ["games"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/dedicated-server"
homepage = "https://github.com/enshwick/dedicated-server"
publish = false

[dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
signal-hook = { version = "0.4.5", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[workspace]
members = [".", "tools/xtask"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
missing_abi = "deny"
non_ascii_idents = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unexpected_cfgs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# cargo-deny owns duplicate versions.
multiple_crate_versions = "allow"
# Its fix, `assert_eq!(value, [] as [T; 0])`, reads worse than `is_empty()`,
# and the test name already says what was expected.
assert_is_empty = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
